services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shopping}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopping
      DB_USER: shopping
      DB_PASSWORD: ${DB_PASSWORD:-shopping}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
