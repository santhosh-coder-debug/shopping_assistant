apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-assistant-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-assistant-web
  template:
    metadata:
      labels:
        app: shopping-assistant-web
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: YOUR_REGISTRY/shopping-assistant-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-assistant-web
spec:
  selector:
    app: shopping-assistant-web
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
