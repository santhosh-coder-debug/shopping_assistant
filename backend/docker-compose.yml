services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopping
      DB_USER: shopping
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your .env file}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - shopping-assistant
  web:
    build:
      context: ../frontend
    ports:
      - "3000:8080"
    depends_on:
      - app
volumes:
  pgdata:
